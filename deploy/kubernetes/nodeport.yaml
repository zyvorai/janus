# NodePort exposure for lab hosts (same pattern as zynera-ui / zynera-api-gateway).
# Must keep selectors — a partial Service apply without them clears endpoints.
apiVersion: v1
kind: Service
metadata:
  name: zyvor-janus-web
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: zyvor-janus-api
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30818
